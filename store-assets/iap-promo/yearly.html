<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1024px;height:1024px;overflow:hidden;}
  body{
    font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:linear-gradient(158deg,#FDF4DF 0%,#F5E3B4 58%,#EBD292 100%);
    position:relative;
  }
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;padding:66px 70px 78px;}
  .toprow{display:flex;flex-direction:column;align-items:center;gap:15px;}
  .tag{
    display:inline-flex;align-items:center;gap:12px;
    background:#E0A32E;color:#fff;font-weight:800;font-size:34px;letter-spacing:4px;
    padding:15px 34px;border-radius:999px;box-shadow:0 10px 24px rgba(190,130,20,0.34);
  }
  .tag .dot{width:14px;height:14px;border-radius:50%;background:#FBE7BB;}
  .badge{
    background:#3E5A2A;color:#FFE7A6;font-weight:900;font-size:25px;letter-spacing:3px;
    padding:10px 24px;border-radius:11px;box-shadow:0 8px 18px rgba(62,90,42,0.24);
  }
  /* 환호 캐릭터를 둥근 카드에 담아 골드 배경과 분리 (의도된 프레임) */
  .card{
    width:524px;height:524px;border-radius:46px;overflow:hidden;
    box-shadow:0 26px 52px rgba(150,105,25,0.28),0 0 0 6px rgba(255,255,255,0.55);
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .foot{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .word{font-size:138px;font-weight:900;line-height:0.9;color:#7A5410;letter-spacing:-3px;}
  .sub{font-size:34px;font-weight:800;color:#A9761B;letter-spacing:7px;
    padding:9px 24px;border:3px solid #E0A32E;border-radius:999px;}
</style></head>
<body>
  <div class="wrap">
    <div class="toprow">
      <div class="tag"><span class="dot"></span>YEARLY</div>
      <div class="badge">BEST VALUE</div>
    </div>
    <div class="card"><img src="../../assets/images/streak-success.png"></div>
    <div class="foot">
      <div class="word">Pro</div>
      <div class="sub">12 MONTHS</div>
    </div>
  </div>
</body>
</html>
