<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1290px;height:2580px;overflow:hidden;}
  /* 배경판은 장마다 다르다(캐릭터 판 / 폰 판). 크기·위치는 config의 bg가 정한다.
     배경색은 팔레트 크림이 아니라 그림 자체의 배경색이다 — 그림이 캔버스보다 작을 때
     이음새가 보이지 않아야 하기 때문. */
  body{
    background-color:{{CREAM}};
    background-image:url("{{HERO}}");
    background-repeat:no-repeat;
    background-size:{{BG_W}}px {{BG_H}}px;
    background-position:{{OFFSET_X}}px {{OFFSET_Y}}px;
    font-family:'Pretendard',-apple-system,sans-serif;
    color:#3C3526;
    position:relative;
  }
  /* 상단 틸 액센트 바 — template.html과 동일 */
  .accent{
    position:absolute;top:212px;left:50%;transform:translateX(-50%);
    width:100px;height:10px;border-radius:6px;background:#2A7B78;
  }
  .caption-zone{
    position:absolute;left:0;right:0;top:270px;
    padding:0 96px;text-align:center;
  }
  .caption{
    font-family:'Jua','Pretendard',sans-serif;
    font-size:90px;line-height:1.2;letter-spacing:-2px;color:#3C3526;
  }
  .caption.en{
    font-family:'Pretendard',sans-serif;font-weight:800;
    font-size:82px;letter-spacing:-3px;
  }
  .sub{
    margin-top:32px;font-size:50px;line-height:1.38;
    color:#6B6358;font-weight:500;letter-spacing:-0.3px;
  }
  /* 그림 속 폰 화면 자리. left/top은 배경 좌표 + 배경 오프셋이라 두 장이 자동으로 맞는다. */
  .screen{
    position:absolute;
    left:calc({{SCREEN_X}}px + {{OFFSET_X}}px);
    top:calc({{SCREEN_Y}}px + {{OFFSET_Y}}px);
    width:{{SCREEN_W}}px;height:{{SCREEN_H}}px;
    border-radius:{{SCREEN_R}}px;
    overflow:hidden;
    display:{{SCREEN_DISPLAY}};
    line-height:0;
    background:#F4EFE6;
  }
  /* 캡처는 폭에 맞추고 넘치는 하단(홈 인디케이터 여백)은 잘린다. */
  .screen img.shot{display:block;width:100%;height:auto;}
  /* 상태바 더미 (배경/높이/색은 compose.mjs가 동적 주입) */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:92px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 30px 0 59px;
    background:#FFFFFF;line-height:1;
  }
  .statusbar .time{
    font-family:'Pretendard',sans-serif;
    font-size:31px;font-weight:600;color:#1c1c1e;letter-spacing:0.5px;
  }
  .statusbar .icons{display:flex;align-items:center;gap:10px;}
  .statusbar .icons svg{display:block;}
  /* 캡처가 그림의 노치를 덮으므로 원본에서 오려낸 노치를 다시 얹는다. */
  .notch{
    position:absolute;top:0;left:{{NOTCH_X}}px;width:{{NOTCH_W}}px;height:auto;
  }
</style></head>
<body>
  <div class="accent"></div>
  <div class="caption-zone">
    <div class="caption" id="caption">{{CAPTION}}</div>
    <div class="sub" id="sub">{{SUB}}</div>
  </div>
  <div class="screen" id="screen">
    <img class="shot" id="shot" src="{{SHOT}}" alt="">
    <div class="statusbar" id="statusbar">
      <span class="time" id="sb-time">9:41</span>
      <span class="icons" id="sb-icons">
        <!-- cellular -->
        <svg width="30" height="21" viewBox="0 0 38 26" fill="currentColor"><rect x="0" y="17" width="6" height="9" rx="1.5"/><rect x="10" y="12" width="6" height="14" rx="1.5"/><rect x="20" y="6" width="6" height="20" rx="1.5"/><rect x="30" y="0" width="6" height="26" rx="1.5"/></svg>
        <!-- wifi -->
        <svg width="27" height="21" viewBox="0 0 34 26" fill="currentColor"><path d="M17 4C23 4 28.4 6.4 32 10.2l-4 4C25.3 11.4 21.4 9.6 17 9.6S8.7 11.4 6 14.2l-4-4C5.6 6.4 11 4 17 4Z"/><path d="M17 13.2c2.9 0 5.5 1.2 7.4 3.1l-4 4c-.9-.9-2.1-1.5-3.4-1.5s-2.5.6-3.4 1.5l-4-4c1.9-1.9 4.5-3.1 7.4-3.1Z"/><circle cx="17" cy="23" r="3"/></svg>
        <!-- battery -->
        <svg width="40" height="21" viewBox="0 0 50 26" fill="none"><rect x="1" y="2" width="42" height="22" rx="6" stroke="currentColor" stroke-width="2.5" opacity="0.5"/><rect x="4" y="5" width="36" height="16" rx="3" fill="currentColor"/><rect x="46" y="9" width="3.5" height="8" rx="1.75" fill="currentColor" opacity="0.5"/></svg>
      </span>
    </div>
    <img class="notch" src="{{NOTCH}}" alt="">
  </div>
</body>
</html>
