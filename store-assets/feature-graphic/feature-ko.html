<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Feature Graphic — KO (cream)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(ellipse at 25% 32%, #FBF5EA 0%, #F2E8D5 52%, #E9DCC4 100%);
    display: flex;
    align-items: center;
    padding: 0 72px;
    font-family: 'Pretendard', -apple-system, sans-serif;
    color: #3C3526;
  }
  /* 우측 배경 카드 실루엣 (teal 톤) */
  .deco {
    position: absolute;
    right: -40px;
    top: 50%;
    transform: translateY(-50%) rotate(-8deg);
    width: 380px;
    height: 240px;
    background: rgba(42, 123, 120, 0.05);
    border: 1.5px solid rgba(42, 123, 120, 0.16);
    border-radius: 20px;
  }
  .deco::before {
    content: '';
    position: absolute;
    inset: 18px;
    background: rgba(42, 123, 120, 0.04);
    border: 1.5px solid rgba(42, 123, 120, 0.12);
    border-radius: 14px;
  }
  .character {
    width: 320px;
    height: 320px;
    flex-shrink: 0;
    margin-right: 40px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 12px 26px rgba(60, 53, 38, 0.22));
  }
  .character img { width: 100%; height: 100%; object-fit: contain; }
  .text { position: relative; z-index: 2; flex: 1; }
  /* 상단 틸 액센트 바 (스크린샷 모티프와 통일) */
  .accent {
    width: 64px; height: 8px; border-radius: 5px;
    background: #2A7B78; margin-bottom: 22px;
  }
  .headline {
    font-family: 'Jua', 'Pretendard', sans-serif;
    font-size: 52px;
    line-height: 1.28;
    letter-spacing: -1.2px;
    color: #3C3526;
  }
  .headline .emph {
    color: #2A7B78;
  }
  .subline {
    margin-top: 22px;
    font-size: 19px;
    font-weight: 500;
    color: #6B6358;
    letter-spacing: -0.3px;
  }
  .brand {
    position: absolute;
    bottom: 32px;
    left: 72px;
    font-size: 15px;
    font-weight: 700;
    color: #6B6358;
    opacity: 0.85;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="deco"></div>
  <div class="character">
    <img src="../../assets/images/Avocado-3D-clean.png" alt="Avocado">
  </div>
  <div class="text">
    <div class="accent"></div>
    <div class="headline">내가 원하는 단어장,<br><span class="emph">내가 찾던 단어장.</span></div>
    <div class="subline">한 · 영 · 일 · 중 · 베 · 스 6개 언어 · AI 단어 생성 · 플래시카드 · 퀴즈</div>
  </div>
  <div class="brand">아보카도 · AVOCADO</div>
</body>
</html>
